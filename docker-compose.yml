services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: medicare_rustfs
    ports:
      - "9000:9000"   # S3 API port
      - "9001:9001"   # Web console port
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  metabase:
    build: 
      context: ./metabase
      dockerfile: dockerfile
    container_name: medicare_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      # DuckDB needs write access for lock files
      - ./medicare_dbt/medicare.duckdb:/duckdb/medicare.duckdb

    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped

volumes:
  rustfs_data:
    driver: local
  metabase_data:
    driver: local