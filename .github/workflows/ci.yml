name: Medicare Pipeline CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb loguru pydantic-settings

      - name: Run tests
        run: pytest tests/ -v
        env:
          DUCKLAKE_CATALOG_PATH: /tmp/test_catalog.ducklake
          DUCKLAKE_DATA_PATH: /tmp/test_lake_data