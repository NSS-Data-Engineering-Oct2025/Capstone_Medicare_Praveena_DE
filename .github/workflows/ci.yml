name: Medicare Pipeline CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb loguru pydantic-settings requests pandas polars boto3

      - name: Run tests
        run: pytest tests/ -v
        env:
          DUCKLAKE_CATALOG_PATH: /tmp/test_catalog.ducklake
          DUCKLAKE_DATA_PATH: /tmp/test_lake_data
          RUSTFS_ENDPOINT: http://fake:0000
          AIRFLOW_RUSTFS_ENDPOINT: http://fake:0000
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key
          RUSTFS_BUCKET: test_bucket
          CMS_API_BASE_URL: https://fake-api.cms.gov
          CMS_INPATIENT_DATASET_ID: fake_inpatient_id
          CMS_PHYSICIAN_DATASET_ID: fake_physician_id

          NPI_CSV_PATH: /tmp/npi.csv
          AIRFLOW_NPI_CSV_PATH: /tmp/npi.csv
          DUCKDB_PATH: /tmp/test.duckdb
          AIRFLOW_DUCKDB_PATH: /tmp/test.duckdb
          INPATIENT_FINAL_TABLE: inpatient_final
          INPATIENT_STAGE_TABLE: inpatient_stage
          PHYSICIAN_FINAL_TABLE: physician_final
          PHYSICIAN_STAGE_TABLE: physician_stage
          NPI_FINAL_TABLE: npi_final
          NPI_STAGE_TABLE: npi_stage
          PHYSICIAN_MAX_ROWS: "500000"